# PfauProtect. Every value here is what the plugin does without this file, except the language: without
# the file the plugin speaks English, and this file asks for Russian.

# Language of what the plugin says: ru or en.
language: ru

# This server's name in a network of several, which the API and the MCP add-on give with their answers.
server-name: ""

worlds:
  # Worlds where no block or entity rows are written. Items are booked wherever they go.
  disabled: []

causes:
  # Block- and entity-plane causes that are not written, for example BLK_LIQUID_FLOW or BLK_FADE.
  # Item-plane causes cannot be turned off: a skipped posting is a gap in every balance after it.
  disabled: []

lookup:
  # The largest radius a lookup or a rollback takes, at most 248.
  max-radius: 200
  # Whether the pages of /pp lookup, near and chat open in a window, which stays up until closed, rather
  # than in chat, where they scroll away. Each player can choose for themselves with /pp view chat|dialog.
  # The console and the inspector always answer in chat.
  dialog: true
  # Lines on a page when a lookup says no limit:, 1 to 200. The server cannot see a player's screen, so
  # each player fits the window to theirs with /pp view rows N. The inspector always shows 10.
  rows: 20

rollback:
  # The most positions one rollback puts back; a larger one is refused and has to be cut by radius or time.
  max-positions: 131072

mobs:
  # How long a change a player made around a mob answers for its death: water let in, a floor taken away.
  fresh-minutes: 10
  # As many mobs of one kind in one chunk as make a farm's crowd, whose deaths nobody caused are not written.
  crowd: 8

chat:
  # Commands the chat log keeps by name only, without their arguments: they carry passwords.
  hidden-commands: [login, l, log, register, reg, changepassword, changepass, unregister]
  # Days a chat, command, join, quit or hit line is kept; 0 keeps them until /pp purge, which removes them too.
  keep-days: 0

metrics:
  # The port Prometheus scrapes /metrics on: how long lookups, writes, rollbacks and self-checks take, how big
  # each base is and how far its writer is behind. 0 keeps it closed.
  port: 0
  # Where it listens. The default is this machine only; 0.0.0.0 opens it to every network the server is on,
  # and nothing asks a scraper who it is.
  address: 127.0.0.1

mcp:
  # The MCP add-on: AI agents of moderators read the history and start rollback previews over MCP Streamable
  # HTTP at /mcp. Off, no port is opened. Every call is checked against the permissions of the player it is
  # made for, and written to mcp-audit.log.
  enabled: false
  # Where it listens. The default is this machine only; 0.0.0.0 opens it to every network the server is on.
  address: 127.0.0.1
  port: 25590
  # The secret of a trusted gateway, which then names the player in X-PfauProtect-Player. Empty turns the
  # gateway mode off. The environment variable PFAUPROTECT_MCP_SECRET wins over this, and keeps the secret out
  # of the file. Players with pfauprotect.mcp make their own tokens with /pp mcp token either way.
  gateway-secret: ""
